name: zg-pools
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pools
      POSTGRES_DB: pools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55438}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pools -d pools"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    profiles: [app]
    build:
      context: .
      target: worker
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      DATABASE_URL: postgresql://pools:${POSTGRES_PASSWORD}@postgres:5432/pools
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pools:${POSTGRES_PASSWORD}@postgres:5432/pools
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POOLS_API_SECRET: ${POOLS_API_SECRET:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres-data:
